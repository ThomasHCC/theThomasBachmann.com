<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Bachmann</title>
<style>
  :root { --bg: #f4f2ee; --text: #1b1a18; --muted: #6d6a64; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121110; --text: #f1eee9; --muted: #a29d95; --accent: #fb923c; } }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: clamp(32px, 6vw, 56px); margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Thomas Bachmann</h1>
  <p>Hier entsteht meine Website.</p>
  <a href="/linktree">Alle Links →</a>
</main>
</body>
</html>
