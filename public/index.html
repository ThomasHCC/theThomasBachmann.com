<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Bachmann – Coming soon</title>
<meta name="description" content="Die Website von Thomas Bachmann – Tanztrainer und Gründer des Hep Cat Club – ist bald online.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='72' font-size='60' font-family='Arial Black,sans-serif' font-weight='900' text-anchor='middle' fill='%23dbff00'>TB</text></svg>">
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
  .soon {
    min-height: 100svh;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 28px var(--pad);
  }
  .soon-main { display: grid; align-content: center; justify-items: start; gap: 28px; max-width: var(--max); width: 100%; margin: 0 auto; }
  .soon-bars { display: flex; align-items: flex-end; gap: 8px; height: 48px; }
  .soon-bars i {
    width: 9px; height: 100%; background: var(--accent); border-radius: 999px 999px 0 0;
    transform-origin: bottom; animation: eq 1.3s ease-in-out infinite alternate;
  }
  .soon-bars i:nth-child(2) { animation-duration: 1s;   animation-delay: -.3s; }
  .soon-bars i:nth-child(3) { animation-duration: 1.6s; animation-delay: -.7s; }
  .soon-bars i:nth-child(4) { animation-duration: 1.15s; animation-delay: -.2s; }
  .soon-bars i:nth-child(5) { animation-duration: 1.45s; animation-delay: -.9s; }
  .soon .hero-name { margin: 0; }
  .soon-tag {
    font-family: var(--display); text-transform: uppercase; line-height: 1;
    font-size: clamp(28px, 4vw, 48px);
    color: #000; background: var(--accent); padding: 8px 18px 10px;
  }
  .soon-text { margin: 0; color: #d4d4d4; font-size: clamp(18px, 1.5vw, 21px); max-width: 46ch; }
  .soon-links { display: flex; flex-wrap: wrap; gap: 12px; }
  .soon .footer { padding: 24px 0 0; }
</style>
</head>
<body>
<div class="soon">
  <a class="logo" href="/">Thomas Bachmann</a>

  <main class="soon-main">
    <div class="soon-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h1 class="hero-name"><span>Thomas</span><span>Bachmann</span></h1>
    <p class="soon-tag">Coming soon</p>
    <p class="soon-text">
      Hier entsteht meine neue Website. Bis dahin findest du mich im
      <strong>Hep Cat Club</strong> in München &amp; Augsburg – und als Tanztrainer auf Workshops weltweit.
    </p>
    <div class="soon-links">
      <a class="btn" href="/linktree">Alle Links <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <a class="btn btn--ghost" href="https://hepcatclub.com" target="_blank" rel="noopener">Hep Cat Club</a>
    </div>
  </main>

  <footer class="footer">
    <ul class="socials">
      <li><a href="https://www.instagram.com/thethomasbachmann/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/></svg></a></li>
      <li><a href="https://www.linkedin.com/in/thethomasbachmann/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg></a></li>
    </ul>
    <p class="legal">
      © 2026 Thomas Bachmann ·
      <a href="/impressum">Impressum</a> ·
      <a href="/datenschutz">Datenschutz</a>
    </p>
  </footer>
</div>
</body>
</html>
